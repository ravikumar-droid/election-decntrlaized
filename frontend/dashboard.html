<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-blue-600 p-4 text-white flex justify-between shadow-lg">
        <h1 class="text-xl font-bold">Web3 Voting DApp</h1>
        <div class="space-x-4">
            <span id="wallet-address" class="bg-blue-800 px-3 py-1 rounded">Not Connected</span>
            <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600">Logout</button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 p-5">
        <button id="connect-btn" class="mb-5 w-full bg-green-500 text-white py-3 rounded text-lg font-bold hover:bg-green-600">
            Connect MetaMask
        </button>

        <h2 class="text-2xl font-bold mb-4">Election Candidates <span id="election-status" class="text-sm px-2 py-1 rounded bg-gray-300 text-black">Checking status...</span></h2>
        
        <div id="candidates-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Candidates rendered here -->
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/web3.js"></script>
    <script>
        checkAuth(); // Protect route

        document.getElementById("connect-btn").addEventListener("click", async () => {
            const web3 = await initWeb3();
            if (web3) {
                document.getElementById("connect-btn").classList.add("hidden");
                loadCandidates();
            }
        });

        async function loadCandidates() {
            try {
                const isActive = await contract.electionActive();
                const statusSpan = document.getElementById("election-status");
                statusSpan.innerText = isActive ? "🟢 Active" : "🔴 Closed";
                statusSpan.className = isActive ? "text-sm px-2 py-1 rounded bg-green-200 text-green-800" : "text-sm px-2 py-1 rounded bg-red-200 text-red-800";

                const candidates = await contract.getAllCandidates();
                const container = document.getElementById("candidates-list");
                container.innerHTML = "";

                candidates.forEach(c => {
                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-lg shadow-md border-l-4 border-blue-500">
                            <h3 class="text-xl font-bold">${c.name}</h3>
                            <p class="text-gray-500 mb-4">Total Votes: <span class="font-bold text-black">${c.voteCount}</span></p>
                            <button onclick="castVote(${c.id})" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">Vote</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error(error);
            }
        }

        async function castVote(id) {
            try {
                const tx = await contract.vote(id);
                Swal.fire({ title: "Voting...", text: "Please wait for transaction to confirm", icon: "info", allowOutsideClick: false });
                Swal.showLoading();
                
                await tx.wait(); // Wait for mining
                
                Swal.fire("Success!", "Your vote has been recorded securely on the blockchain.", "success");
                loadCandidates(); // Refresh UI
            } catch (error) {
                Swal.fire("Error", error.reason || "Failed to vote. Ensure election is active and you haven't voted.", "error");
            }
        }
    </script>
</body>
</html>
