<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 text-white flex justify-between items-center shadow">
        <h1 class="text-xl font-bold">Secure Web3 Voting</h1>
        <span id="walletAddress" class="bg-blue-800 px-3 py-1 rounded text-sm">Not Logged In</span>
    </nav>

    <div class="max-w-3xl mx-auto mt-10 p-5">
        
        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="bg-white p-8 rounded-lg shadow-md text-center">
            <h2 class="text-2xl font-bold mb-4">Login to Vote or Manage</h2>
            <p class="text-gray-600 mb-6">Connect your MetaMask wallet to securely log in.</p>
            <button onclick="login()" class="bg-blue-500 text-white px-6 py-3 rounded text-lg font-bold hover:bg-blue-600">Login with Wallet</button>
        </div>

        <!-- ADMIN PANEL (Hidden by default) -->
        <div id="adminPanel" class="hidden bg-white p-6 rounded-lg shadow-md border-t-4 border-red-500 mb-6">
            <h2 class="text-2xl font-bold text-red-600 mb-4">👑 Admin Dashboard</h2>
            
            <div class="mb-4">
                <p class="mb-2 font-bold">Election Status: <span id="adminStatus" class="text-red-500">Closed</span></p>
                <button onclick="toggleElection()" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">Open/Close Election</button>
            </div>

            <div class="flex gap-2 mt-6">
                <input type="text" id="candidateName" placeholder="New Candidate Name" class="border p-2 w-full rounded">
                <button onclick="addCandidate()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Add</button>
            </div>
        </div>

        <!-- VOTER PANEL (Hidden by default) -->
        <div id="voterPanel" class="hidden bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-500">
            <h2 class="text-2xl font-bold text-blue-600 mb-4">🗳️ Voting Dashboard</h2>
            <p class="mb-4 font-bold bg-gray-200 inline-block px-3 py-1 rounded">Election Status: <span id="voterStatus" class="text-red-500">Closed</span></p>
            
            <div id="candidatesList" class="space-y-3 mt-4">
                <!-- Candidates will load here -->
            </div>
        </div>

    </div>

    <script>
        // PASTE YOUR CONTRACT ADDRESS HERE:
        const contractAddress = "0x1C2A441FE00474D0F95402F7F3D2bD794936F8E7"; 
        
        const abi = [
            "function admin() public view returns (address)",
            "function votingOpen() public view returns (bool)",
            "function addCandidate(string memory _name) public",
            "function toggleVoting() public",
            "function vote(uint _candidateIndex) public",
            "function getCandidates() public view returns (tuple(string name, uint voteCount)[])"
        ];

        let provider, signer, contract, userAddress;

        // 1. LOGIN SYSTEM
        async function login() {
            if (!window.ethereum) return alert("Please install MetaMask!");
            
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            contract = new ethers.Contract(contractAddress, abi, signer);
            userAddress = await signer.getAddress();
            
            document.getElementById('walletAddress').innerText = userAddress.substring(0,6) + "..." + userAddress.substring(38);
            document.getElementById('loginScreen').classList.add('hidden');

            checkRoleAndLoad();
        }

        // 2. CHECK IF USER IS ADMIN OR NORMAL VOTER
        async function checkRoleAndLoad() {
            const adminAddress = await contract.admin();
            const isOpen = await contract.votingOpen();
            
            const statusText = isOpen ? "🟢 OPEN" : "🔴 CLOSED";
            document.getElementById('adminStatus').innerText = statusText;
            document.getElementById('voterStatus').innerText = statusText;

            if (userAddress.toLowerCase() === adminAddress.toLowerCase()) {
                document.getElementById('adminPanel').classList.remove('hidden'); // Show Admin Panel
            }
            
            document.getElementById('voterPanel').classList.remove('hidden'); // Show Voter Panel to everyone
            loadCandidates();
        }

        // 3. LOAD CANDIDATES
        async function loadCandidates() {
            const candidates = await contract.getCandidates();
            let html = "";
            candidates.forEach((c, index) => {
                html += `
                <div class="border p-4 rounded bg-gray-50 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-lg">${c.name}</h3>
                        <p class="text-sm text-gray-600">Total Votes: <span class="font-bold">${c.voteCount}</span></p>
                    </div>
                    <button onclick="castVote(${index})" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Vote</button>
                </div>`;
            });
            document.getElementById('candidatesList').innerHTML = html;
        }

        // 4. ADMIN: ADD CANDIDATE
        async function addCandidate() {
            const name = document.getElementById('candidateName').value;
            if(!name) return alert("Enter a name!");
            try {
                const tx = await contract.addCandidate(name);
                await tx.wait();
                alert("Candidate Added!");
                loadCandidates();
            } catch (err) { alert("Error adding candidate."); }
        }

        // 5. ADMIN: OPEN/CLOSE ELECTION
        async function toggleElection() {
            try {
                const tx = await contract.toggleVoting();
                await tx.wait();
                alert("Election status changed!");
                checkRoleAndLoad(); // Refresh status
            } catch (err) { alert("Error changing status."); }
        }

        // 6. VOTER: CAST VOTE
        async function castVote(index) {
            try {
                const tx = await contract.vote(index);
                await tx.wait();
                alert("Vote successful!");
                loadCandidates();
            } catch (err) { alert("Error: Election might be closed, or you already voted!"); }
        }
    </script>
</body>
</html>
