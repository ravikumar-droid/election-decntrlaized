<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Voting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 text-white flex justify-between items-center shadow">
        <h1 class="text-xl font-bold">Secure Web3 Voting</h1>
        <span id="walletAddress" class="bg-blue-800 px-3 py-1 rounded text-sm font-mono">Not Connected</span>
    </nav>

    <div class="max-w-3xl mx-auto mt-10 p-5">
        
        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="bg-white p-8 rounded-lg shadow-md text-center">
            <h2 class="text-2xl font-bold mb-4 text-blue-600">Voting Login</h2>
            <p class="text-gray-600 mb-6">Connect your MetaMask wallet to start.</p>
            <button onclick="login()" class="bg-blue-500 text-white px-6 py-3 rounded text-lg font-bold hover:bg-blue-600 transition shadow-lg">Login with Wallet</button>
        </div>

        <!-- ADMIN PANEL (Hidden) -->
        <div id="adminPanel" class="hidden bg-white p-6 rounded-lg shadow-md border-t-4 border-red-500 mb-6 animate-fade-in">
            <h2 class="text-2xl font-bold text-red-600 mb-4 flex items-center">👑 Admin Dashboard</h2>
            <div class="bg-red-50 p-4 rounded mb-4 flex justify-between items-center">
                <p class="font-bold">Election Status: <span id="adminStatus" class="text-gray-500">Loading...</span></p>
                <button onclick="toggleElection()" class="bg-red-500 text-white px-4 py-2 rounded font-bold hover:bg-red-600">Toggle Status</button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="candidateName" placeholder="Enter Candidate Name" class="border p-2 w-full rounded focus:ring-2 focus:ring-red-500 outline-none">
                <button onclick="addCandidate()" class="bg-green-500 text-white px-6 py-2 rounded font-bold hover:bg-green-600">Add</button>
            </div>
        </div>

        <!-- VOTER PANEL (Hidden) -->
        <div id="voterPanel" class="hidden bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-500">
            <h2 class="text-2xl font-bold text-blue-600 mb-4">🗳️ Voter Dashboard</h2>
            <div class="bg-blue-50 p-3 rounded mb-4">
                <p class="font-bold text-blue-800">Election Status: <span id="voterStatus">Loading...</span></p>
            </div>
            <div id="candidatesList" class="space-y-3">
                <!-- Candidates will load here -->
                <p class="text-gray-400 italic">No candidates added yet...</p>
            </div>
        </div>

    </div>

    <script>
        // PASTE YOUR CONTRACT ADDRESS HERE:
        const contractAddress = "0x1c2a441fe00474d0f95402f7f3d2bd794936f8e7";
        
        const abi = [
            "function admin() public view returns (address)",
            "function votingOpen() public view returns (bool)",
            "function addCandidate(string memory _name) public",
            "function toggleVoting() public",
            "function vote(uint _candidateIndex) public",
            "function getCandidates() public view returns (tuple(string name, uint voteCount)[])"
        ];

        let provider, signer, contract, userAddress;

        async function login() {
            try {
                if (!window.ethereum) return alert("Please install MetaMask!");
                
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                contract = new ethers.Contract(contractAddress, abi, signer);
                userAddress = await signer.getAddress();
                
                document.getElementById('walletAddress').innerText = "Wallet: " + userAddress.substring(0,6) + "..." + userAddress.substring(38);
                document.getElementById('loginScreen').classList.add('hidden');

                await checkRoleAndLoad();
            } catch (err) {
                console.error(err);
                alert("Login failed. Check console for details.");
            }
        }

        async function checkRoleAndLoad() {
            try {
                const adminAddress = await contract.admin();
                const isOpen = await contract.votingOpen();
                
                const statusText = isOpen ? "🟢 OPEN" : "🔴 CLOSED";
                document.getElementById('adminStatus').innerText = statusText;
                document.getElementById('voterStatus').innerText = statusText;

                // Case-insensitive check for Admin
                if (userAddress.toLowerCase() === adminAddress.toLowerCase()) {
                    document.getElementById('adminPanel').classList.remove('hidden');
                }
                
                document.getElementById('voterPanel').classList.remove('hidden');
                loadCandidates();
            } catch (err) {
                console.error("Blockchain error:", err);
                alert("Could not load data from blockchain. Ensure your contract address is correct.");
            }
        }

        async function loadCandidates() {
            try {
                const candidates = await contract.getCandidates();
                const container = document.getElementById('candidatesList');
                
                if (candidates.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 italic">No candidates yet. Admin must add some.</p>';
                    return;
                }

                let html = "";
                candidates.forEach((c, index) => {
                    html += `
                    <div class="border p-4 rounded-lg bg-gray-50 flex justify-between items-center shadow-sm">
                        <div>
                            <h3 class="font-bold text-lg text-blue-900">${c.name}</h3>
                            <p class="text-sm text-gray-500 font-bold italic">Votes: ${c.voteCount}</p>
                        </div>
                        <button onclick="castVote(${index})" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700">Vote</button>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error("Load Candidates Error:", err);
            }
        }

        async function addCandidate() {
            const name = document.getElementById('candidateName').value;
            if(!name) return alert("Enter a name!");
            try {
                const tx = await contract.addCandidate(name);
                await tx.wait();
                alert("Candidate Added Successfully!");
                loadCandidates();
                document.getElementById('candidateName').value = "";
            } catch (err) { alert("Error adding candidate. Are you the admin?"); }
        }

        async function toggleElection() {
            try {
                const tx = await contract.toggleVoting();
                await tx.wait();
                await checkRoleAndLoad();
                alert("Election status updated!");
            } catch (err) { alert("Only Admin can toggle election."); }
        }

        async function castVote(index) {
            try {
                const tx = await contract.vote(index);
                alert("Voting in progress... please wait.");
                await tx.wait();
                alert("Vote successful!");
                loadCandidates();
            } catch (err) { 
                alert("Failed: Either the election is CLOSED, or you already voted!"); 
            }
        }
    </script>
</body>
</html>
